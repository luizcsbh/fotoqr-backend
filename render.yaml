services:
  - type: web
    name: fotoqr-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://fotoqreventos.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://fotoqreventos.netlify.app
      - key: BACKEND_PUBLIC_URL
        value: https://fotoqr-backend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: MAX_FILES_PER_UPLOAD
        value: "20"
      - key: MAX_UPLOADS_PER_MINUTE
        value: "60"
